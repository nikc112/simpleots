<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Passwort anzeigen</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">


    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #111827;
            margin: 0;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #f3f4f6;
            padding: 32px;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo img {
            height: 180px;
        }

        @media (max-width: 900px) {
            .logo img { height: 150px; }
        }

        @media (max-width: 600px) {
            .logo img { height: 120px; }
        }

        h2 {
            margin-top: 0;
            font-size: 26px;
        }

        pre {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #d1d5db;
            text-align: left;
        }

        .hint {
            margin-top: 16px;
            font-size: 14px;
            color: #6b7280;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 999px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            color: #ffffff;
            width: 100%;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .copied-msg {
            margin-top: 10px;
            font-size: 14px;
            color: #059669;
            display: none;
        }
    </style>

    <script>
        function copyPassword() {
            const text = document.getElementById("pw").innerText;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function () {
                    showCopiedMsg();
                }).catch(function () {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.focus();
            ta.select();

            try {
                document.execCommand("copy");
            } catch (e) {}

            document.body.removeChild(ta);
            showCopiedMsg();
        }

        function showCopiedMsg() {
            const msg = document.getElementById("copiedMsg");
            msg.style.display = "block";
            setTimeout(() => msg.style.display = "none", 2000);
        }
    </script>

</head>
<body>

<div class="card">
    <div class="logo">
        <img src="/logo" alt="Logo">
    </div>

    <h2>Passwort</h2>

    <pre id="pw">{{ secret }}</pre>

    <button class="btn" onclick="copyPassword()">Passwort kopieren</button>
    <div id="copiedMsg" class="copied-msg">Passwort wurde kopiert.</div>

    <p class="hint">Dieses Passwort wurde jetzt geloescht.</p>

    <button class="btn" onclick="window.location.href='/'">Zurueck zur Startseite</button>
</div>

</body>
</html>
